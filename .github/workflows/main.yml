name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the shared build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hatchet-build:1.98
          cache-from: type=gha,scope=hatchet-build-environment
          cache-to: type=gha,mode=max,scope=hatchet-build-environment

      - name: Restore Cargo build cache
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
            .ci-cache/target/.rustc_info.json
            .ci-cache/target/debug
            .ci-cache/target/thumbv6m-none-eabi
            .ci-cache/target/thumbv7em-none-eabihf
            .ci-cache/target/wasm32-unknown-unknown
          key: hatchet-cargo-v2-${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'Dockerfile', 'compose.yaml', 'compose.ci.yaml', 'Justfile') }}
          restore-keys: |
            hatchet-cargo-v2-${{ runner.os }}-ci-

      - name: Create cache directories
        run: mkdir -p .ci-cache/cargo-registry .ci-cache/cargo-git .ci-cache/target

      - name: Run CI checks
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm build just ci

      - name: Generate code coverage
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm build just coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

      # Cargo runs as root in the container, while actions/cache archives files
      # as the host runner user. Normalize ownership before its post-job save.
      - name: Prepare Cargo cache for upload
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .ci-cache
          chmod -R u+rwX .ci-cache
