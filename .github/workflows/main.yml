name: CI

on: [push, pull_request]

permissions:
  contents: read

# Keep only the newest CI run for each pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve runner user
        id: user
        shell: bash
        run: printf 'uid=%s\ngid=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build the shared build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nata-build:latest
          build-args: |
            USER_UID=${{ steps.user.outputs.uid }}
            USER_GID=${{ steps.user.outputs.gid }}
          cache-from: type=gha,scope=nata-build-environment
          cache-to: type=gha,mode=max,scope=nata-build-environment

      - name: Restore Cargo build cache
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
            .ci-cache/target/.rustc_info.json
            .ci-cache/target/debug
            .ci-cache/target/llvm-cov-target
            .ci-cache/target/thumbv6m-none-eabi
            .ci-cache/target/thumbv7em-none-eabihf
            .ci-cache/target/wasm32-unknown-unknown
          key: nata-cargo-v2-${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'Dockerfile', 'compose.yaml', 'compose.ci.yaml', 'Justfile') }}
          restore-keys: |
            nata-cargo-v2-${{ runner.os }}-ci-

      - name: Create cache directories
        run: mkdir -p .ci-cache/cargo-registry .ci-cache/cargo-git .ci-cache/target

      - name: Run CI checks
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm build just ci

      - name: Generate code coverage
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm build just coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true
