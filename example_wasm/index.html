<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hatchet PCAP viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #07110f;
        color: #e8f5ef;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(41, 184, 135, 0.16), transparent 34rem),
          #07110f;
      }

      main {
        width: min(72rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4rem 0;
      }

      h1 { margin-bottom: 0.5rem; font-size: clamp(2rem, 5vw, 3.5rem); }
      .intro { max-width: 45rem; color: #a8c5ba; font-size: 1.05rem; }

      .controls {
        display: grid;
        gap: 1rem;
        margin: 2rem 0;
        padding: 1.25rem;
        border: 1px solid #24483b;
        border-radius: 1rem;
        background: rgba(9, 27, 22, 0.88);
      }

      form { display: flex; gap: 0.75rem; }
      input[type="url"] { flex: 1; min-width: 0; }

      input, button, .file-button {
        border: 1px solid #376354;
        border-radius: 0.6rem;
        padding: 0.75rem 0.9rem;
        font: inherit;
      }

      input { background: #07110f; color: inherit; }
      button, .file-button {
        cursor: pointer;
        background: #2bd497;
        color: #03130d;
        font-weight: 700;
      }

      button:disabled, .file-button.disabled { cursor: wait; opacity: 0.55; }
      input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }

      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        color: #6e9587;
      }

      .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #24483b; }
      #status { min-height: 1.5rem; margin: 0 0 0.75rem; color: #a8c5ba; }

      pre {
        min-height: 16rem;
        max-height: 65vh;
        overflow: auto;
        margin: 0;
        padding: 1.25rem;
        border: 1px solid #24483b;
        border-radius: 1rem;
        background: #030806;
        color: #c9f7e5;
        font: 0.86rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 40rem) {
        main { padding: 2rem 0; }
        form { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hatchet PCAP viewer</h1>
      <p class="intro">Load a legacy <code>.pcap</code> capture. Hatchet decodes it locally in WebAssembly and prints every packet in Rust <code>Debug</code> format.</p>

      <section class="controls" aria-label="Choose a PCAP source">
        <form id="url-form">
          <input id="url" type="url" required placeholder="https://example.com/capture.pcap" aria-label="PCAP URL">
          <button type="submit">Load URL</button>
        </form>
        <div class="divider">or</div>
        <div>
          <label class="file-button" for="file">Browse for a PCAP</label>
          <input id="file" type="file" accept=".pcap,application/vnd.tcpdump.pcap,application/octet-stream">
        </div>
      </section>

      <p id="status" role="status" aria-live="polite">Initializing WebAssembly…</p>
      <pre id="output" tabindex="0">Choose a capture to inspect.</pre>
    </main>

    <script type="module">
      import init, { read_packets } from './pkg/example_wasm.js';

      const urlForm = document.querySelector('#url-form');
      const urlInput = document.querySelector('#url');
      const fileInput = document.querySelector('#file');
      const fileButton = document.querySelector('.file-button');
      const status = document.querySelector('#status');
      const output = document.querySelector('#output');
      const wasmReady = init();

      function setBusy(busy, message) {
        urlForm.querySelector('button').disabled = busy;
        urlInput.disabled = busy;
        fileInput.disabled = busy;
        fileButton.classList.toggle('disabled', busy);
        status.textContent = message;
      }

      function errorMessage(error) {
        return error instanceof Error ? error.message : String(error);
      }

      async function parse(bytes, source) {
        setBusy(true, `Parsing ${source}…`);
        output.textContent = '';

        try {
          await wasmReady;
          output.textContent = read_packets(bytes);
          status.textContent = `Parsed ${source} (${bytes.byteLength.toLocaleString()} bytes).`;
        } catch (error) {
          status.textContent = `Could not parse ${source}.`;
          output.textContent = errorMessage(error);
        } finally {
          setBusy(false, status.textContent);
        }
      }

      wasmReady.then(() => {
        status.textContent = 'Ready. Choose a capture to inspect.';
      }).catch((error) => {
        status.textContent = 'WebAssembly failed to initialize.';
        output.textContent = errorMessage(error);
      });

      urlForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const url = urlInput.value.trim();
        setBusy(true, `Downloading ${url}…`);

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
          await parse(new Uint8Array(await response.arrayBuffer()), url);
        } catch (error) {
          status.textContent = `Could not load ${url}. The server may not permit cross-origin requests.`;
          output.textContent = errorMessage(error);
          setBusy(false, status.textContent);
        }
      });

      fileInput.addEventListener('change', async () => {
        const [file] = fileInput.files;
        if (file) await parse(new Uint8Array(await file.arrayBuffer()), file.name);
        fileInput.value = '';
      });
    </script>
  </body>
</html>
