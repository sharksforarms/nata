services:
  build:
    environment:
      # Incremental artifacts are large and do not archive efficiently on CI.
      CARGO_INCREMENTAL: "0"
    volumes:
      - .:/workspace
      - ./.ci-cache/cargo-registry:/home/nata/.cargo/registry
      - ./.ci-cache/cargo-git:/home/nata/.cargo/git
      - ./.ci-cache/target:/workspace/target
