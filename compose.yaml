name: nata

services:
  build:
    image: nata-build:latest
    build:
      context: .
      args:
        USER_UID: ${NATA_USER_UID:-1000}
        USER_GID: ${NATA_USER_GID:-1000}
    init: true
    volumes:
      - .:/workspace
      - cargo-registry:/home/nata/.cargo/registry
      - cargo-git:/home/nata/.cargo/git
      - cargo-target:/workspace/target

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
